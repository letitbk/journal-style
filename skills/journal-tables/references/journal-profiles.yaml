# journal-profiles.yaml
# Machine-readable house-style profiles for journal tables.
# Profiles for ASR, AJS, Social Forces, Demography are GROUNDED in real award-paper
# tables (see house-style-notes.md for the evidence and per-journal exemplar manifest).
# PNAS is RULES-ONLY (encoded from PNAS author guidelines; only 4 PNAS PDFs were in the
# corpus, too few to ground empirically). Flagged accordingly.
#
# Consumed by scripts/render_table.{R,py} (generate) and scripts/lint_table.py (validate).
# Values are deliberately explicit so a generator can imitate and a linter can check.

# ---- shared sociology defaults (inherited unless a journal overrides) ----
defaults:
  rules:
    style: booktabs           # horizontal rules only
    vertical_rules: false     # NEVER vertical/grid lines
    double_top_rule: false
    spanner_rules: true       # short straddle rule under grouped column headers
  caption:
    position: above
    label: "Table {n}."       # e.g., "Table 1."
    label_case: titlecase     # "Table" not "TABLE"
    title_case: title         # Title Case Of Major Words
    bold: false
    italic: false
  estimate_layout:
    uncertainty: se           # what sits with the estimate by default
    placement: stacked_below  # SE on its own line beneath the coefficient
    wrapper: parentheses      # ( )
    ci_format: null           # CIs uncommon in soc; use brackets [ ] if requested
    side_by_side_models: true # Model 1, Model 2, ... as adjacent columns
  stars:
    legend: "* p < .05  ** p < .01  *** p < .001"
    thresholds: [0.05, 0.01, 0.001]
    symbols: ["*", "**", "***"]
    p_symbol: "p"             # lowercase roman p
    leading_zero: false       # ".05" not "0.05"
    marginal: null            # set to a symbol+threshold if the journal uses one
    tailedness: two-tailed    # state "(two-tailed tests)" in the note when known
    star_on: estimate         # superscript on the coefficient, never the SE line
  decimals:
    coef: 3                   # regression coefficients
    se: 3
    descriptive: 2            # means / SDs in descriptive tables
    percent: 1
    leading_zero: false       # drop leading zero for |x| < 1
    align: decimal            # decimal-point alignment within a column
  note:
    label: "Note:"
    plural_label: "Notes:"
    source_label: "Source:"
    smaller_font: true
    # order of contents within the note:
    order: [source, nobs, units, estimator, se_type, star_legend]
    star_legend_last: true
  gof_rows: [nobs, r2, adj_r2, log_lik]   # which fit rows to show, model-dependent
  variable_labels:
    human_readable: true      # "Years of education", never "yrs_educ"
    show_reference_categories: true
    reference_format: "(ref.)"
  typography:
    font: serif
    density: medium
  wide_tables:
    rotate_landscape: true    # set very wide tables sideways on a dedicated page

# ---------------------------------------------------------------------------
profiles:

  ASR:
    name: American Sociological Review
    grounded: true
    # ASR-specific confirmations from the corpus:
    stars:
      legend: "* p < .05  ** p < .01  *** p < .001"
      thresholds: [0.05, 0.01, 0.001]
      symbols: ["*", "**", "***"]
      p_symbol: "p"
      leading_zero: false
      marginal: { symbol: "†", threshold: 0.10 }   # ~25-35% of tables add † p<.10
      tailedness: two-tailed
      star_on: estimate
    note:
      label: "Note:"
      plural_label: "Notes:"
      source_label: "Source:"
      smaller_font: true
      order: [source, nobs, units, estimator, se_type, star_legend]
      star_legend_last: true
    submission_format: docx   # ASR submissions are typically Word

  AJS:
    name: American Journal of Sociology
    grounded: true
    publisher: University of Chicago Press
    # AJS has a DISTINCTIVE U. Chicago house style — override several defaults:
    rules:
      style: booktabs
      vertical_rules: false
      double_top_rule: true        # SIGNATURE: doubled rule at the very top
      spanner_rules: true
    caption:
      position: above
      label: "TABLE {n}"           # ALL CAPS, NO period after the number
      label_case: uppercase
      title_case: smallcaps        # title set in small caps, centered, on its own line
      title_on_separate_line: true
      bold: false
      italic: false
    stars:
      legend: "* P < .05  ** P < .01  *** P < .001"
      thresholds: [0.05, 0.01, 0.001]
      symbols: ["*", "**", "***"]
      p_symbol: "P"                # SIGNATURE: capital italic P
      p_italic: true
      leading_zero: false
      marginal: { symbol: "†", threshold: 0.10 }
      tailedness: two-tailed
      star_on: estimate
    note:
      label: "Note.—"              # SIGNATURE: small-caps run-in with em dash, no colon
      plural_label: "Note.—"
      source_label: "Source.—"
      smallcaps_leadin: true
      smaller_font: true
      order: [source, nobs, units, estimator, se_type, star_legend]
      star_legend_last: true
    extras:
      dot_leaders: true            # row labels connected to first column with dot leaders
    submission_format: docx

  SocialForces:
    name: Social Forces
    grounded: true
    publisher: Oxford University Press
    era_note: >
      Two visual eras. LEGACY (pre-~2015): "Table 1:" colon, drop leading zeros,
      "Notes:" plural. MODERN OUP (~2015+): "Table 1." bold + bold title, KEEP leading
      zeros (0.05), "Note:" singular, light grey header shading. Default to MODERN.
    caption:
      position: above
      label: "Table {n}."
      label_case: titlecase
      title_case: title
      bold: true                   # modern OUP: bold label + bold title
      italic: false
      align: left
    stars:
      legend: "*p < 0.05  **p < 0.01  ***p < 0.001"
      thresholds: [0.05, 0.01, 0.001]
      symbols: ["*", "**", "***"]
      p_symbol: "p"
      leading_zero: true           # modern OUP keeps leading zeros
      marginal: null
      tailedness: two-tailed
      star_on: estimate
    decimals:
      coef: 2
      se: 2
      descriptive: 2
      percent: 1
      leading_zero: true
      align: decimal
    note:
      label: "Note:"
      plural_label: "Notes:"
      source_label: "Source:"
      smaller_font: true
      # SF states FE/clustering/weights in the NOTE, not as on/off indicator rows
      order: [estimator, controls, se_type, weights, source, nobs, star_legend]
      star_legend_last: false      # SF often puts the star legend line FIRST, then "Note:"
    variable_labels:
      human_readable: true
      show_reference_categories: true
      reference_format: "(Ref: {level})"   # inline in the group-head label
    gof_rows: [nobs, r2, adj_r2]
    submission_format: docx

  Demography:
    name: Demography
    grounded: true
    publisher: Duke University Press (2021+)
    era_note: >
      Two eras. LEGACY (pre-2021): bold "Table N." + bold title. DUKE UP (2021+):
      "Table N" bold label, roman (non-bold) title. Booktabs skeleton constant.
    caption:
      position: above
      label: "Table {n}"
      label_case: titlecase
      title_case: sentence
      bold: true                   # label bold; title bold (legacy) or roman (Duke)
      italic: false
    # SIGNATURE: Demography puts SE in a SEPARATE adjacent column, often square brackets,
    # NOT stacked-in-parentheses-below like ASR/AJS/SF.
    estimate_layout:
      uncertainty: se
      placement: separate_column   # SE in its own column beside the coefficient
      wrapper: brackets            # [ ]
      sig_column: true             # a dedicated "Sig." column is common
      ci_format: null
      side_by_side_models: true    # model/sample groups under spanners
    stars:
      legend: "*p < .05  **p < .01  ***p < .001"
      thresholds: [0.05, 0.01, 0.001]
      symbols: ["*", "**", "***"]
      p_symbol: "p"
      leading_zero: false
      marginal: null
      alt_ladder: "*p < .10  **p < .05  ***p < .01"   # a minority of tables shift the ladder
      tailedness: unstated
      star_on: estimate
    decimals:
      coef: 3                      # 3-decimal coefficients dominate
      se: 3
      descriptive: 2
      percent: 1
      leading_zero: false
      align: decimal
    note:
      label: "Note:"
      plural_label: "Notes:"
      source_label: "Source:"
      smaller_font: true
      order: [source, nobs, estimator, se_type, star_legend]
      star_legend_last: true
    variable_labels:
      human_readable: true
      show_reference_categories: true
      reference_format: "(ref. = {level})"
    gof_rows: [nobs]                  # N is the consistently reported fit stat
    submission_format: docx

  PNAS:
    name: Proceedings of the National Academy of Sciences
    grounded: false              # RULES-ONLY: only 4 PNAS PDFs in corpus; not corpus-grounded
    grounding_note: >
      Encoded from PNAS author/figure guidelines, NOT from the award corpus. Verify against
      a recent PNAS table before trusting for submission.
    rules:
      style: booktabs
      vertical_rules: false
      double_top_rule: false
      spanner_rules: true
    caption:
      position: above
      label: "Table {n}."
      label_case: titlecase
      title_case: sentence
      bold: false
      italic: false
    estimate_layout:
      uncertainty: ci             # PNAS leans to CIs or SE; multidisciplinary
      placement: same_row
      wrapper: parentheses
      ci_format: brackets
      side_by_side_models: true
    stars:
      legend: "*P < 0.05, †P < 0.01, ‡P < 0.001"   # PNAS uses symbol footnotes; verify
      thresholds: [0.05, 0.01, 0.001]
      symbols: ["*", "†", "‡"]
      p_symbol: "P"
      p_italic: true
      leading_zero: true          # PNAS keeps leading zeros (0.05)
      marginal: null
      tailedness: unstated
      star_on: estimate
      note: "PNAS often reports exact P values rather than stars; prefer exact P when feasible."
    decimals:
      coef: 2
      se: 2
      descriptive: 2
      percent: 1
      leading_zero: true
      align: decimal
    note:
      label: "Note:"             # PNAS uses symbol-keyed footnotes (*, †, ‡, §)
      smaller_font: true
      order: [nobs, units, estimator, se_type, star_legend]
      star_legend_last: true
    column_widths_cm: [8.7, 11.4, 17.8]   # PNAS 1-col / 1.5-col / 2-col
    variable_labels:
      human_readable: true
      show_reference_categories: true
      reference_format: "(ref.)"
    gof_rows: [nobs, r2]
    typography:
      font: serif
      density: compact
    submission_format: latex
