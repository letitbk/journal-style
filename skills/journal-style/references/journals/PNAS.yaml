id: PNAS
name: Proceedings of the National Academy of Sciences
aliases: [PNAS, "Proc Natl Acad Sci", "Proceedings of the National Academy of Sciences"]
publisher: National Academy of Sciences
extends: []
ready: draft

sources:
  pnas-submitting:
    url: https://www.pnas.org/author-center/submitting-your-manuscript
    accessed: 2026-10-24
    kind: guideline
  pnas-digital-art:
    url: https://www.pnas.org/pb-assets/authors/digitalart-1675347574760.pdf
    title: "PNAS Digital Art Guidelines (dated 2022-02-16)"
    accessed: 2026-10-24
    kind: guideline

evidence:
  # Table conventions beyond the caption are not in the guidelines, and only 4 PNAS
  # papers were in the award corpus, too few to read conventions from.
  tables: {status: provisional, sources: []}
  tables.caption: {status: guideline, sources: [pnas-submitting]}
  figures: {status: guideline, sources: [pnas-submitting, pnas-digital-art]}
  figures.caption: {status: provisional, sources: []}
  figures.panel_labels: {status: provisional, sources: []}

requirements:
  tables:
    - {rule: "Submit tables in editable Word, RTF, or LaTeX, with a brief title above and footnotes below; avoid multipart tables", stage: submission, source: pnas-submitting}
    - {rule: "Say whether a number after ± is a standard error (SEM) or a standard deviation (SD), and give the P value", stage: submission, source: pnas-submitting}
  figures:
    - {rule: "Color mode RGB; files as TIFF, EPS, PDF, or PPT", stage: submission, source: pnas-submitting}

tables:
  rules:
    style: booktabs
    vertical_rules: false
    double_top_rule: false
    spanner_rules: true
  caption:
    position: above
    label: "Table {n}."
    label_case: titlecase
    title_case: sentence
    bold: false
    italic: false
  estimate_layout:
    uncertainty: ci              # PNAS leans to CIs or SEs
    placement: same_row
    wrapper: parentheses
    ci_format: brackets
    side_by_side_models: true
  stars:
    legend: "*P < 0.05, †P < 0.01, ‡P < 0.001"   # PNAS uses symbol footnotes
    thresholds: [0.05, 0.01, 0.001]
    symbols: ["*", "†", "‡"]
    p_symbol: "P"
    p_italic: true
    leading_zero: true
    marginal: null
    tailedness: unstated
    star_on: estimate
    note: "PNAS often reports exact P values rather than stars; prefer exact P when feasible."
  decimals:
    coef: 2
    se: 2
    descriptive: 2
    percent: 1
    leading_zero: true
    align: decimal
  note:
    label: "Note:"               # PNAS uses symbol-keyed footnotes (*, †, ‡, §)
    smaller_font: true
    order: [nobs, units, estimator, se_type, star_legend]
    star_legend_last: true
  column_widths_cm: [8.7, 11.4, 17.8]
  variable_labels:
    human_readable: true
    show_reference_categories: true
    reference_format: "(ref.)"
  gof_rows: [nobs, r2]
  typography:
    font: serif
    density: compact
  submission_format: latex

figures:
  caption: {position: below, format: "Fig. {n}.", title_case: sentence}
  color: {policy: color_ok, redundant_encoding: true, color_ok_for: [any]}
  fonts: {in_figure: sans_serif, family: "Arial/Helvetica", min_pt_at_print: 6, max_pt: 12, prefer_pt: 8}
  panel_labels: {style: "A/B/C", position: top_left_of_panel}
  width:
    single_col_cm: 8.7
    one_and_half_col_cm: 11.4
    full_width_cm: 17.8
    max_height_cm: 22.5
  raster: {dpi_min_halftone: 300, dpi_min_combination: 600, dpi_min_line_art: 1000}
  line_width_min_pt: 0.25

notes: |
  The figure rules come from the PNAS submission page and the Digital Art Guidelines (both read 2026-10-24). The table rules beyond the caption are not in the guidelines; compare with a recent PNAS table before you submit.

  Tables
  - Editable Word, RTF, or LaTeX. A brief title above and footnotes below. Avoid multipart tables.
  - Say whether a number after ± is an SEM or an SD, and give P values.
  - Not from the guidelines (provisional): booktabs with no vertical rules, footnotes keyed with symbols (*, †, ‡, §), exact P values preferred to stars, leading zeros kept (0.05), compact layout.

  Figures
  - Widths of 8.7 cm (1 column), 11.4 cm (1.5 columns), or 17.8 cm (2 columns), at most 22.5 cm tall.
  - Standard fonts such as Arial, Helvetica, Times, or Symbol, 6 to 12 pt after reduction (8 pt is a good size). Graph lines at least 0.25 pt.
  - Resolution: 1000 to 1200 ppi for line art, 600 to 900 ppi for combination art, 300 ppi for halftones. Color mode RGB. Files as TIFF, EPS, PDF, or PPT.
  - Not from the guidelines (provisional): "Fig. N." caption below and capital panel labels A, B, C.
