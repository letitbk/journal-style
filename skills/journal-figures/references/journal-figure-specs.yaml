# journal-figure-specs.yaml
# Per-journal figure house style + submission specs.
#
# QUALITATIVE conventions (caption placement/format, grayscale policy, chart types,
# anti-patterns, panel labels, axes) are GROUNDED in real award-paper figures
# (see figure-house-style-notes.md).
# NUMERIC specs (column widths in mm/in, dpi, fonts) come from each journal's author
# guidelines — marked `verify: true`; confirm against the current guidelines before submission.
#
# Consumed by scripts/check_figure.py (validate) and the SKILL.md generate checklist.

defaults:
  caption:
    position: below              # figures: caption BELOW (tables go above)
    format: "Figure {n}."
  color:
    policy: grayscale_preferred  # sociology print journals lean B/W
    redundant_encoding: true     # distinguish series by line dash + marker shape + grey shade,
                                 # NOT hue alone -> must survive grayscale conversion
    color_ok_for: [maps, "<=2 series", photographs]
  chart_types_common: [line_trend, coefficient_forest, bar, scatter, conceptual_path_diagram, map]
  anti_patterns: [pie, 3d, dual_axis, dynamite_bar_with_error_caps, chartjunk, decorative_color]
  uncertainty: ci_band_or_whisker   # show CIs; never bare bars with error caps
  fonts:
    in_figure: sans_serif        # axis/tick/legend text inside the figure
    min_pt_at_print: 7           # effective point size at final printed width
  panel_labels:
    style: "(a)/(b) or A/B"
    position: above_panel
  axes:
    plain_language_titles: true  # "Years of schooling", not raw variable names
    gridlines: none_or_light
    legend: inside_or_below
  raster:
    dpi_min_halftone: 300        # photos / shaded
    dpi_min_line_art: 600        # line art / charts (1200 ideal)
  vector_preferred: true         # PDF/EPS/SVG for line art; raster only for photos/maps
  file_formats: [pdf, eps, svg, tiff, png]
  width:                         # physical width at print; verify exact values
    single_col_in: 3.3
    full_width_in: 6.9
    rotate_wide_landscape: true

profiles:

  ASR:
    name: American Sociological Review
    grounded_qualitative: true
    publisher: SAGE
    caption:
      position: below
      format: "Figure {n}."      # bold "Figure N.", title-case title (title not bold)
      label_bold: true
      title_case: title
      source_note_below: true    # Source:/Note:/sig footnotes below caption, smaller
    color: { policy: grayscale_preferred, redundant_encoding: true, color_ok_for: [maps, "<=2 series"] }
    fonts: { in_figure: sans_serif, min_pt_at_print: 7 }
    panel_labels: { style: "(a)/(b) or (A)/(B)", position: above_panel }
    width: { single_col_in: 3.42, full_width_in: 7.0, rotate_wide_landscape: true, verify: true }
    raster: { dpi_min_halftone: 300, dpi_min_line_art: 1200 }
    note: "Signature: heavy use of conceptual/path box-and-arrow diagrams. Aesthetic is plain (Stata/base-R/diagram), not glossy ggplot."

  AJS:
    name: American Journal of Sociology
    grounded_qualitative: true
    publisher: University of Chicago Press
    caption:
      position: below
      format: "Fig. {n}.—"       # SIGNATURE: small-caps "Fig." + em-dash run-in, sentence case
      smallcaps_leadin: true
      label_bold: false
      title_case: sentence
      source_note_inline: true   # sources/CI defs folded into the continuous caption sentence
    color: { policy: grayscale_preferred, redundant_encoding: true, color_ok_for: [maps, "many series"] }
    fonts: { in_figure: serif_or_sans, min_pt_at_print: 7 }  # classic figures serif; software charts sans
    panel_labels: { style: "A/B or a)/b)", position: above_panel }
    width: { single_col_in: 3.3, full_width_in: 6.5, rotate_wide_landscape: true, verify: true }
    note: "Signature: 'Fig. N.—' small-caps em-dash caption below; conceptual/network diagrams; rotated landscape figures are common."

  SocialForces:
    name: Social Forces
    grounded_qualitative: true
    publisher: Oxford University Press
    era_note: >
      LEGACY: "FIGURE 1:" all-caps bold serif colon, B/W only. MODERN OUP: "Figure 1." bold
      sans sentence-case, color allowed (ggplot gray-panel). Default to MODERN.
    caption:
      position: above            # UNUSUAL: Social Forces puts the figure title ABOVE the plot
      format: "Figure {n}."      # modern: bold sans, sentence case
      label_bold: true
      title_case: sentence
      source_note_below: true    # bold "Note:"/"Source:" BELOW the figure
    color: { policy: color_ok, redundant_encoding: true, color_ok_for: [any] }
    fonts: { in_figure: sans_serif, min_pt_at_print: 7 }
    panel_labels: { style: "bold A/B or 'Panel A:'", position: top_left_of_panel }
    width: { single_col_in: 3.35, full_width_in: 6.85, rotate_wide_landscape: true, verify: true }
    note: "Caption/title ABOVE the figure (unlike ASR/AJS); notes/source below. Modern OUP color OK but keep shape/dash redundancy."

  Demography:
    name: Demography
    grounded_qualitative: false   # only 2 figure pages in the award corpus — figure-light papers
    grounding_note: "Figure conventions NOT corpus-grounded (corpus too thin). Uses defaults + Duke UP guidelines; verify."
    publisher: Duke University Press
    caption: { position: below, format: "Figure {n}.", label_bold: true, title_case: sentence }
    color: { policy: color_ok, redundant_encoding: true, color_ok_for: [any] }
    fonts: { in_figure: sans_serif, min_pt_at_print: 7 }
    panel_labels: { style: "(a)/(b) or A/B", position: above_panel }
    width: { single_col_in: 3.35, full_width_in: 6.85, rotate_wide_landscape: true, verify: true }

  PNAS:
    name: Proceedings of the National Academy of Sciences
    grounded_qualitative: false   # rules-only (4 PNAS PDFs in corpus)
    grounding_note: "From PNAS figure guidelines, not the corpus. Well-documented exact specs below."
    caption: { position: below, format: "Fig. {n}.", title_case: sentence }
    color: { policy: color_ok, redundant_encoding: true, color_ok_for: [any] }
    fonts: { in_figure: sans_serif, family: "Helvetica/Arial", min_pt_at_print: 6, max_pt: 12, prefer_pt: 8 }
    panel_labels: { style: "A/B/C", position: top_left_of_panel }
    width:                        # PNAS exact column specs (well-documented)
      single_col_cm: 8.7
      one_and_half_col_cm: 11.4
      full_width_cm: 17.8
      max_height_cm: 22.5
      verify: false
    raster: { dpi_min_halftone: 300, dpi_min_line_art: 600 }
    line_width_min_pt: 0.5
    note: "PNAS columns: 8.7 / 11.4 / 17.8 cm. Fonts Helvetica/Arial 6-12pt (8pt ideal). Lines >= 0.5pt."
